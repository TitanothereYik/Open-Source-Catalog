name: Update catalog

on:
  schedule:
    # GitHub drops workflows scheduled at minute 0 when the hour starts.
    # :07 is the hourly run (Hong Kong and UTC). :32 retries if :07 never queued.
    - cron: "7,32 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip if this hour already updated
        id: gate
        if: github.event_name == 'schedule'
        run: |
          python3 - << 'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          hk = ZoneInfo("Asia/Hong_Kong")
          data = json.loads(open("data/catalog.json").read())
          raw = data.get("updated_at") or ""
          now = datetime.now(hk)
          ran = False
          if raw:
              moment = datetime.fromisoformat(raw).astimezone(hk)
              ran = moment.strftime("%Y-%m-%dT%H") == now.strftime("%Y-%m-%dT%H")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"skip={'true' if ran else 'false'}\n")
          print(("skip" if ran else "run"), raw)
          PY

      - name: Refresh catalog
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fixed Pages root. Do not derive this from the event payload:
          # schedule runs can omit repository name and produce a bad URL.
          SITE_BASE_URL: https://titanothereyik.github.io/Open-Source-Catalog/
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/catalog_tool.py update

      - name: Commit catalog
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "Open Source Catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -F notifications/latest.md
          git push origin HEAD:main

      - name: Notify
        if: github.event_name != 'schedule' || steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("notifications/latest.md", "utf8");
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "catalog-update",
                color: "e4b15a",
                description: "Open Source Catalog update",
              });
            } catch (error) {
              // Label already exists.
            }
            const listed = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "catalog-update",
              per_page: 10,
            });
            const existing = listed.data.find((issue) => !issue.pull_request);
            if (!existing) {
              await github.rest.issues.create({
                owner,
                repo,
                title: "Open Source Catalog updates",
                body,
                labels: ["catalog-update"],
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            }
