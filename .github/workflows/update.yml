name: Update catalog

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC = 08:00, 14:00, 20:00, 02:00 香港時間
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scripts/catalog_tool.py update

      - name: Commit catalog
        run: |
          git config user.name "Open Source Catalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -F notifications/latest.md
          git push

      - name: Notify
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("notifications/latest.md", "utf8");
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "catalog-update",
                color: "e4b15a",
                description: "Open Source Catalog update",
              });
            } catch (error) {
              // Label already exists.
            }
            const listed = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "catalog-update",
              per_page: 10,
            });
            const existing = listed.data.find((issue) => !issue.pull_request);
            if (!existing) {
              await github.rest.issues.create({
                owner,
                repo,
                title: "Open Source Catalog updates",
                body,
                labels: ["catalog-update"],
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            }
